name: LinkedIn Test
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: KYCnow LinkedIn prüfen
        run: |
          curl -L -A "Mozilla/5.0" -s -o linkedin.html -w "HTTP Status: %{http_code}\n" "https://www.linkedin.com/company/kycnow/posts/"
          echo "Dateigröße:"
          wc -c linkedin.html
          echo "Seitentitel:"
          grep -o '<title>[^<]*' linkedin.html | head -1
