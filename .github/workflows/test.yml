name: LinkedIn Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check LinkedIn posts
        shell: bash
        run: |
          curl -L -A "Mozilla/5.0" -s -o linkedin.html "https://www.linkedin.com/company/kycnow/posts/"
          echo "Activity IDs:"
          grep -oE '(activity-|activity:)[0-9]{10,}' linkedin.html | head -20 || true
