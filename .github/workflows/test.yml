name: LinkedIn Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check LinkedIn
        shell: bash
        run: |
          curl -L -A "Mozilla/5.0" -s -o linkedin.html -w "HTTP Status: %{http_code}\n" "https://www.linkedin.com/company/kycnow/posts/"
          echo "File size:"
          wc -c linkedin.html
          echo "Post hints:"
          grep -oE 'activity:[0-9]+|/posts/[^" ]+' linkedin.html | head -10 || true
