name: LinkedIn Company Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check company posts
        shell: bash
        run: |
          curl -L -A "Mozilla/5.0" -s -o linkedin.html "https://www.linkedin.com/company/kycnow/"
          echo "Post markers:"
          grep -oE 'data-activity-urn="[^"]+"|main-feed-card__overlay-link|updates__list' linkedin.html | head -20 || true
