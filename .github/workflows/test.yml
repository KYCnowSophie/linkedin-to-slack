name: RSS Feed erstellen

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: linkedin-rss
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: LinkedIn prüfen
        run: python generate_feed.py

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add last_seen.txt

          if grep -q "<item>" feed.xml; then
            git add feed.xml
          fi

          if git diff --cached --quiet; then
            echo "Keine neuen LinkedIn-Posts."
            exit 0
          fi

          git commit -m "Update LinkedIn RSS feed"
          git pull --rebase origin main
          git push
