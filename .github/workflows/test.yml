name: RSS Feed erstellen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: RSS Feed erzeugen
        run: python generate_feed.py

      - name: Feed speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add feed.xml
          git commit -m "Update LinkedIn RSS feed" || echo "Keine Änderungen"
          git push
