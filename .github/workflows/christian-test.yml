name: Christian LinkedIn Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Christian Profil prüfen
        shell: bash
        run: |
          curl -L -A "Mozilla/5.0" -s -o christian.html "https://www.linkedin.com/in/christian-schaper/"

          echo "Dateigröße:"
          wc -c christian.html

          echo "Post-Bereich:"
          grep -oE 'public_profile__posts|updates__list' christian.html | head -10 || true

          echo "Activity IDs:"
          grep -oE 'urn:li:activity:[0-9]+' christian.html | head -20 || true

          echo "Post Links:"
          grep -oE 'https?[^" ]+linkedin.com/posts/[^" ]+' christian.html | head -20 || true
